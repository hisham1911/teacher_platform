<svg width="420" height="115" viewBox="0 0 420 115" fill="none" xmlns="http://www.w3.org/2000/svg" style="direction: ltr;">
  <!-- Flight Trail Curve -->
  <path d="M 220 38 C 242 36, 260 30, 274 20 C 282 14, 288 12, 296 14" 
        stroke="rgba(2, 132, 199, 0.35)" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" />
  
  <!-- Origami Paper Airplane -->
  <g transform="translate(290, 0) rotate(14) scale(0.95)">
    <polygon points="44,4 4,19 23,31" fill="#7dd3fc" />
    <polygon points="44,4 23,31 38,41" fill="#bae6fd" />
    <polygon points="23,31 38,41 27,39" fill="#0284c7" />
    <line x1="44" y1="4" x2="23" y2="31" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Spark Rays (Left of 'English') -->
  <g stroke="#475569" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="38" y1="52" x2="43" y2="40" />
    <line x1="32" y1="63" x2="18" y2="52" />
    <line x1="30" y1="76" x2="16" y2="80" />
  </g>

  <!-- Text Group -->
  <g font-family="'Fredoka', 'Quicksand', 'Comfortaa', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5px">
    <text x="56" y="86" fill="#273444">English</text>
    <text x="238" y="86" fill="#0284c7">Spark</text>
  </g>

  <!-- Spark Rays (Right of 'Spark') -->
  <g stroke="#0ea5e9" stroke-width="2.8" stroke-linecap="round" opacity="0.9">
    <line x1="378" y1="64" x2="394" y2="56" />
    <line x1="378" y1="76" x2="394" y2="83" />
  </g>

  <!-- Sparkle Star -->
  <path d="M 388 94 Q 388 99 393 99 Q 388 99 388 104 Q 388 99 383 99 Q 388 99 388 94 Z" 
        fill="#0284c7" opacity="0.9" />
</svg>
