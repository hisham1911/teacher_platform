name: Phase 2 Generate Migration

on:
  push:
    branches:
      - feature/phase2-classes-assignments
    paths:
      - .github/workflows/phase2-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=teacher_platform_design;Username=postgres;Password=postgres
      DataProtection__KeysDirectory: /tmp/teacher-platform-keys-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-classes-assignments
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore
      - name: Build
        working-directory: backend
        run: dotnet build --no-restore
      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.3
      - name: Generate Phase 2 migration
        working-directory: backend
        run: |
          dotnet ef migrations add Phase2ClassesAssignments \
            --project src/TeacherPlatform.Infrastructure/TeacherPlatform.Infrastructure.csproj \
            --startup-project src/TeacherPlatform.Api/TeacherPlatform.Api.csproj \
            --output-dir Persistence/Migrations \
            --no-build
      - name: Commit generated EF files to Phase 2 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/TeacherPlatform.Infrastructure/Persistence/Migrations/
          git commit -m "feat(phase2): add classes assignments migration"
          git push origin HEAD:feature/phase2-classes-assignments
