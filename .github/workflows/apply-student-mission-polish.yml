name: Apply student mission polish

on:
  push:
    branches:
      - feature/english-spark-ux-foundation
    paths:
      - '.github/workflows/apply-student-mission-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-spark-ux-foundation
          fetch-depth: 0

      - name: Apply focused student UX patch
        run: python .github/scripts/apply_student_mission_polish.py

      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- apps/web/src/routes/play/student-ui.tsx apps/web/src/routes/play/play-page.tsx apps/web/src/routes/play/play-page.test.tsx e2e/tests/part-e-progressive.spec.mjs e2e/tests/part-f-english-spark-golden-path.spec.mjs

      - name: Commit student polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/routes/play/student-ui.tsx apps/web/src/routes/play/play-page.tsx apps/web/src/routes/play/play-page.test.tsx e2e/tests/part-e-progressive.spec.mjs e2e/tests/part-f-english-spark-golden-path.spec.mjs
          git commit -m "feat(web): make student entry mission-first"
          git push origin HEAD:feature/english-spark-ux-foundation
