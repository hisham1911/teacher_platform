name: Bulk import engineering

on:
  push:
    branches: [feature/english-spark-ux-foundation]
    paths:
      - '.github/workflows/bulk-import-engineering.yml'

permissions:
  contents: write

jobs:
  engineer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: teacher_platform_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=teacher_platform_ci;Username=postgres;Password=postgres_ci_password
      INTEGRATION_TEST_DB: Host=localhost;Port=5432;Database=teacher_platform_ci;Username=postgres;Password=postgres_ci_password
      DataProtection__KeysDirectory: /tmp/teacher-platform-keys-bulk-import

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-spark-ux-foundation
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wire atomic bulk import end to end
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path_name}: {old[:180]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # QuestionService can participate in an existing orchestration transaction while
          # retaining ownership when called from the normal single-question endpoint.
          question_service = 'backend/src/TeacherPlatform.Infrastructure/Services/QuestionService.cs'
          replace_once(
              question_service,
              '''        await using var transaction = await _db.Database.BeginTransactionAsync(cancellationToken);\n\n        var question = new Question''',
              '''        await using var transaction = _db.Database.CurrentTransaction is null\n            ? await _db.Database.BeginTransactionAsync(cancellationToken)\n            : null;\n\n        var question = new Question''',
          )
          replace_once(
              question_service,
              '''        await _db.SaveChangesAsync(cancellationToken);\n        await transaction.CommitAsync(cancellationToken);\n\n        var detail = BuildDetail(question, version, tags, includeUrls: false);''',
              '''        await _db.SaveChangesAsync(cancellationToken);\n        if (transaction is not null)\n        {\n            await transaction.CommitAsync(cancellationToken);\n        }\n\n        var detail = BuildDetail(question, version, tags, includeUrls: false);''',
          )

          # DI registration.
          program = 'backend/src/TeacherPlatform.Api/Program.cs'
          replace_once(
              program,
              '''builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.MediaService>();\nbuilder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.QuestionService>();''',
              '''builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.MediaService>();\nbuilder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.QuestionService>();\nbuilder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.BulkQuestionImportService>();''',
          )

          # HTTP boundary. Keep authorization identical to other question writes.
          controller = 'backend/src/TeacherPlatform.Api/Controllers/QuestionsController.cs'
          replace_once(
              controller,
              '''    private readonly QuestionService _questionService;\n\n    public QuestionsController(QuestionService questionService)\n    {\n        _questionService = questionService;\n    }''',
              '''    private readonly QuestionService _questionService;\n    private readonly BulkQuestionImportService _bulkImportService;\n\n    public QuestionsController(\n        QuestionService questionService,\n        BulkQuestionImportService bulkImportService)\n    {\n        _questionService = questionService;\n        _bulkImportService = bulkImportService;\n    }''',
          )
          marker = '''    /// <summary>تفاصيل السؤال مع النسخة الحالية والوسوم.</summary>\n    [HttpGet("{questionId:guid}")]'''
          endpoint = '''    /// <summary>\n    /// يحفظ مجموعة أسئلة راجعها المستخدم كعملية واحدة. عند استهداف نشاط،\n    /// إنشاء الأسئلة وربطها بالمسودة يحدثان داخل نفس المعاملة أو يتم التراجع عن الكل.\n    /// </summary>\n    [HttpPost("bulk")]\n    [Authorize(Policy = AuthorizationPolicies.TenantContentManagement)]\n    [ProducesResponseType(typeof(BulkQuestionImportResponse), StatusCodes.Status200OK)]\n    [ProducesResponseType(StatusCodes.Status400BadRequest)]\n    [ProducesResponseType(StatusCodes.Status404NotFound)]\n    [ProducesResponseType(StatusCodes.Status409Conflict)]\n    public async Task<IActionResult> BulkCreate(\n        [FromRoute] Guid tenantId,\n        [FromBody] BulkQuestionImportRequest request,\n        CancellationToken cancellationToken)\n    {\n        if (!ModelState.IsValid)\n        {\n            return BadRequest(ModelState);\n        }\n\n        var result = await _bulkImportService.ImportAsync(request, CurrentUserId(), cancellationToken);\n        return Ok(result);\n    }\n\n''' + marker
          replace_once(controller, marker, endpoint)

          # Frontend DTOs mirror server contract.
          question_types = 'apps/web/src/types/questions.ts'
          replace_once(
              question_types,
              '''export interface CreateQuestionVersionRequest {''',
              '''export interface BulkQuestionImportRequest {\n  questions: CreateQuestionRequest[];\n  quizId?: string | null;\n}\n\nexport interface BulkQuestionImportResponse {\n  createdCount: number;\n  questionIds: string[];\n  quizId: string | null;\n}\n\nexport interface CreateQuestionVersionRequest {''',
          )

          endpoints = 'apps/web/src/data/api-client/endpoints.ts'
          replace_once(
              endpoints,
              '''  CreateQuestionRequest,\n  CreateQuestionVersionRequest,\n  MediaAsset,''',
              '''  CreateQuestionRequest,\n  CreateQuestionVersionRequest,\n  BulkQuestionImportRequest,\n  BulkQuestionImportResponse,\n  MediaAsset,''',
          )
          replace_once(
              endpoints,
              '''  create(tenantId: string, payload: CreateQuestionRequest, signal?: AbortSignal) {\n    return call<QuestionDetail>({\n      method: 'POST',\n      path: `/api/v1/tenants/${tenantId}/questions`,\n      body: payload,\n      signal,\n      needsAuth: true,\n      needsTenant: true,\n    });\n  },\n  createNewVersion''',
              '''  create(tenantId: string, payload: CreateQuestionRequest, signal?: AbortSignal) {\n    return call<QuestionDetail>({\n      method: 'POST',\n      path: `/api/v1/tenants/${tenantId}/questions`,\n      body: payload,\n      signal,\n      needsAuth: true,\n      needsTenant: true,\n    });\n  },\n  bulkCreate(tenantId: string, payload: BulkQuestionImportRequest, signal?: AbortSignal) {\n    return call<BulkQuestionImportResponse>({\n      method: 'POST',\n      path: `/api/v1/tenants/${tenantId}/questions/bulk`,\n      body: payload,\n      signal,\n      needsAuth: true,\n      needsTenant: true,\n    });\n  },\n  createNewVersion''',
          )

          # Replace the browser-side row-by-row partial persistence with one server operation.
          bulk_page = 'apps/web/src/routes/dashboard/activities/activity-bulk-questions-page.tsx'
          replace_once(
              bulk_page,
              '''import { questionBanksApi, questionsApi, quizzesApi } from '../../../data/api-client/endpoints';''',
              '''import { questionBanksApi, questionsApi } from '../../../data/api-client/endpoints';''',
          )
          replace_once(
              bulk_page,
              '''  const saveMutation = useMutation({\n    mutationFn: async () => {\n      if (!tenantId || !resolvedBankId) throw new Error('missing-context');\n      const createdIds: string[] = [];\n      const failedRows: number[] = [];\n      for (const row of validRows) {\n        try {\n          const created = await questionsApi.create(tenantId, bulkQuestionRowToRequest(row, resolvedBankId));\n          createdIds.push(created.id);\n          if (quizId) await quizzesApi.addItem(tenantId, quizId, { questionId: created.id });\n        } catch {\n          failedRows.push(row.row);\n        }\n      }\n      return { createdIds, failedRows };\n    },\n    onSuccess: async ({ createdIds, failedRows }) => {\n      if (quizId) await queryClient.invalidateQueries({ queryKey: ['quiz-draft', tenantId, quizId] });\n      await queryClient.invalidateQueries({ queryKey: ['questions', tenantId] });\n      await queryClient.invalidateQueries({ queryKey: ['question-banks', tenantId] });\n      if (failedRows.length === 0) navigate(backPath, { replace: true });\n      else setResultMessage(`تمت إضافة ${createdIds.length} سؤالًا. تعذر حفظ الصفوف: ${failedRows.join('، ')}.`);\n    },\n    onError: () => setResultMessage('تعذر حفظ المجموعة. الملف ما زال محددًا ويمكن المحاولة مرة أخرى.'),\n  });''',
              '''  const saveMutation = useMutation({\n    mutationFn: async () => {\n      if (!tenantId || !resolvedBankId) throw new Error('missing-context');\n      return questionsApi.bulkCreate(tenantId, {\n        questions: validRows.map((row) => bulkQuestionRowToRequest(row, resolvedBankId)),\n        quizId: quizId ?? null,\n      });\n    },\n    onSuccess: async () => {\n      if (quizId) await queryClient.invalidateQueries({ queryKey: ['quiz-draft', tenantId, quizId] });\n      await queryClient.invalidateQueries({ queryKey: ['questions', tenantId] });\n      await queryClient.invalidateQueries({ queryKey: ['question-banks', tenantId] });\n      navigate(backPath, { replace: true });\n    },\n    onError: () => setResultMessage('تعذر حفظ المجموعة. لم يتم حفظ أي سؤال من هذا الملف؛ راجع البيانات وحاول مرة أخرى.'),\n  });''',
          )
          replace_once(
              bulk_page,
              '''<p className="mt-2 max-w-3xl text-sm leading-7 text-violet-100">ارفع ملف Excel أو CSV فقط. سنعرض الأسئلة والأخطاء أولًا، ولن يتم حفظ أي شيء قبل تأكيدك{attachToActivity ? '، وبعد الحفظ تضاف الأسئلة للنشاط الحالي تلقائيًا' : ''}.</p>''',
              '''<p className="mt-2 max-w-3xl text-sm leading-7 text-violet-100">ارفع ملف Excel أو CSV فقط. سنعرض الأسئلة والأخطاء أولًا، ولن يتم حفظ أي شيء قبل تأكيدك. عند الحفظ تُحفظ المجموعة كاملة أو لا يُحفظ منها شيء{attachToActivity ? '، وتُربط كلها بالنشاط الحالي في نفس العملية' : ''}.</p>''',
          )

      - name: Format backend
        working-directory: backend
        run: |
          dotnet restore
          dotnet format --no-restore

      - name: Verify backend including atomic rollback
        working-directory: backend
        run: |
          dotnet build --no-restore
          dotnet test tests/TeacherPlatform.Domain.Tests --no-build
          dotnet test tests/TeacherPlatform.Api.Tests --no-build
          dotnet test tests/TeacherPlatform.IntegrationTests --no-build

      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm install --registry https://registry.npmjs.org
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Remove one-time workflow and commit validated import
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bulk-import-engineering.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'feat(import): make question imports atomic'
          git push origin HEAD:feature/english-spark-ux-foundation
