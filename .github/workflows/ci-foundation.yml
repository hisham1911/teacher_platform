name: Foundation CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: apps/web
        run: npm install --registry https://registry.npmjs.org

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Verify dist
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/web/dist/index.html")) { throw "dist missing" }

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: teacher_platform_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      INTEGRATION_TEST_DB: Host=localhost;Port=5432;Database=teacher_platform_ci;Username=postgres;Password=postgres_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Setup test database
        shell: bash
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          psql -h localhost -U postgres -d teacher_platform_ci -c "SELECT 1" > /dev/null
          echo "Test database ready"

      - name: Test Domain
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.Domain.Tests --no-build

      - name: Test Api
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.Api.Tests --no-build

      - name: Test Integration (PostgreSQL)
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.IntegrationTests --no-build

      - name: Publish smoke
        working-directory: backend
        run: dotnet publish src/TeacherPlatform.Api/TeacherPlatform.Api.csproj -c Release -o obj/Release/publish-test --no-build
