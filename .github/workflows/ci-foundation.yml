name: Foundation CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: apps/web
        run: npm install --registry https://registry.npmjs.org

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Verify dist
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/web/dist/index.html")) { throw "dist missing" }

      - name: SPA refresh returns index.html (static fallback check)
        working-directory: apps/web
        shell: bash
        run: |
          # Preview the build and confirm a deep route returns index.html instead of 404
          node -e "
            const http = require('http');
            const fs = require('fs');
            const path = require('path');
            const root = path.resolve('dist');
            const server = http.createServer((req, res) => {
              const filePath = path.join(root, req.url === '/' ? 'index.html' : req.url);
              const exists = fs.existsSync(filePath) && fs.statSync(filePath).isFile();
              const target = exists ? filePath : path.join(root, 'index.html');
              res.setHeader('Content-Type', 'text/html; charset=utf-8');
              res.end(fs.readFileSync(target));
            });
            server.listen(4173, () => {
              http.get('http://localhost:4173/dashboard/settings', (res) => {
                const body = [];
                res.on('data', (c) => body.push(c));
                res.on('end', () => {
                  const html = Buffer.concat(body).toString();
                  if (!html.includes('<div id=\"root\">')) {
                    console.error('SPA fallback failed');
                    process.exit(1);
                  }
                  console.log('SPA fallback working');
                  server.close(() => process.exit(0));
                });
              }).on('error', () => process.exit(1));
            });
          "

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: teacher_platform_ci
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=teacher_platform_ci;Username=postgres;Password=postgres_ci_password
      INTEGRATION_TEST_DB: Host=localhost;Port=5432;Database=teacher_platform_ci;Username=postgres;Password=postgres_ci_password
      DataProtection__KeysDirectory: /tmp/teacher-platform-keys-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Vulnerability audit (direct + transitive)
        working-directory: backend
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt || true
          if grep -Ei "High|Critical" vuln.txt | grep -vi "no vulnerable"; then
            echo "High or Critical vulnerability found"
            exit 1
          fi

      - name: Format check
        working-directory: backend
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore

      - name: Test Domain
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.Domain.Tests --no-build

      - name: Test Api
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.Api.Tests --no-build

      - name: Test Integration (PostgreSQL — Auth flow, Refresh rotation, Tenancy)
        working-directory: backend
        run: dotnet test tests/TeacherPlatform.IntegrationTests --no-build

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.3

      - name: Migration — apply to a fresh database (idempotent SQL script check)
        working-directory: backend
        shell: bash
        env:
          PGPASSWORD: postgres_ci_password
          FRESH_DB: teacher_platform_migration_check
        run: |
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS $FRESH_DB;" || true
          psql -h localhost -U postgres -c "CREATE DATABASE $FRESH_DB;"
          dotnet ef migrations script \
            --project src/TeacherPlatform.Infrastructure/TeacherPlatform.Infrastructure.csproj \
            --startup-project src/TeacherPlatform.Api/TeacherPlatform.Api.csproj \
            --idempotent \
            --output /tmp/migration.sql
          psql -h localhost -U postgres -d $FRESH_DB -f /tmp/migration.sql
          psql -h localhost -U postgres -d $FRESH_DB -f /tmp/migration.sql
          # Migrations applied twice (idempotent script re-runs without error)
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS $FRESH_DB;"

      - name: Publish smoke
        working-directory: backend
        run: dotnet publish src/TeacherPlatform.Api/TeacherPlatform.Api.csproj -c Release -o obj/Release/publish-test --no-restore
