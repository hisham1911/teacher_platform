name: Student roster EF codegen

on:
  push:
    branches: [feature/english-spark-ux-foundation]
    paths:
      - '.github/workflows/student-roster-codegen.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-spark-ux-foundation
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Register roster services
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/src/TeacherPlatform.Api/Program.cs')
          text = path.read_text(encoding='utf-8')
          old = '''builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.GuestTokenService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.SessionService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.PlayerService>();'''
          new = '''builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.GuestTokenService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.StudentService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.ManagedStudentJoinService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.SessionService>();
          builder.Services.AddScoped<TeacherPlatform.Infrastructure.Services.PlayerService>();'''
          if old not in text:
              raise SystemExit('Expected service registration block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Generate EF migration and snapshot from the model
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          rm -f src/TeacherPlatform.Infrastructure/Persistence/Migrations/20260828142000_CreateStudentRoster.cs
          dotnet restore
          dotnet build --no-restore
          dotnet tool install --global dotnet-ef --version 10.0.3
          dotnet ef migrations add CreateStudentRoster \
            --project src/TeacherPlatform.Infrastructure/TeacherPlatform.Infrastructure.csproj \
            --startup-project src/TeacherPlatform.Api/TeacherPlatform.Api.csproj
          dotnet format --no-restore

      - name: Remove one-time workflow and commit generated model artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/student-roster-codegen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/TeacherPlatform.Api/Program.cs \
                  backend/src/TeacherPlatform.Infrastructure/Persistence/Migrations \
                  .github/workflows/student-roster-codegen.yml
          git commit -m 'chore(students): generate EF migration and register services'
          git push origin HEAD:feature/english-spark-ux-foundation
