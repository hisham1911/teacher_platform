name: Fix progressive join test

on:
  push:
    branches:
      - feature/english-spark-ux-foundation
    paths:
      - '.github/workflows/fix-progressive-join-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/english-spark-ux-foundation
          fetch-depth: 0

      - name: Update only the progressive join test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/routes/play/play-page.test.tsx')
          text = path.read_text(encoding='utf-8')
          start_marker = "  it('يعرض شاشة استعداد التحدي المتدرج بعد الانضمام ثم يبدأ من المستوى الأول', async () => {"
          end_marker = "  it('يستأنف محاولة تحدٍ متدرج قائمة مباشرة من المستوى المحفوظ', async () => {"

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          old = "name: 'ابدأ الاختبار'"
          count = block.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 stale progressive join selectors, found {count}')

          block = block.replace(old, "name: 'ادخل إلى المهمة'")
          updated = text[:start] + block + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          git diff --check
          git diff -- apps/web/src/routes/play/play-page.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/routes/play/play-page.test.tsx
          git commit -m "test(web): align progressive join CTA"
          git push origin HEAD:feature/english-spark-ux-foundation
