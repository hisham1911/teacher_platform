name: Phase 2 Full Browser A-I
# Final Phase 2 verification trigger after Part I selector hardening.

on:
  push:
    branches:
      - feature/phase2-classes-assignments
    paths:
      - .github/workflows/phase2-full-browser.yml

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teacher_platform_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: E2E
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=teacher_platform_e2e;Username=postgres;Password=postgres
      DataProtection__KeysDirectory: /tmp/teacher-platform-e2e-keys
      API_URL: http://localhost:5000
      WEB_URL: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:5000
      Auth__WebBaseUrl: http://localhost:5173
      Auth__TrustedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__0: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-classes-assignments
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore, build and apply fresh migrations
        working-directory: backend
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet tool install --global dotnet-ef --version 10.0.3
          dotnet ef database update \
            --project src/TeacherPlatform.Infrastructure/TeacherPlatform.Infrastructure.csproj \
            --startup-project src/TeacherPlatform.Api/TeacherPlatform.Api.csproj \
            --no-build
      - name: Install frontend and browser dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix e2e
          cd e2e
          npx playwright install --with-deps chromium
      - name: Run full browser suite A through I
        shell: bash
        run: |
          set -euo pipefail
          API_PID=""
          WEB_PID=""
          cleanup() {
            if [ -n "$API_PID" ]; then kill "$API_PID" 2>/dev/null || true; fi
            if [ -n "$WEB_PID" ]; then kill "$WEB_PID" 2>/dev/null || true; fi
            echo '--- API LOG TAIL ---'
            tail -n 120 /tmp/phase2-api.log 2>/dev/null || true
            echo '--- WEB LOG TAIL ---'
            tail -n 80 /tmp/phase2-web.log 2>/dev/null || true
          }
          trap cleanup EXIT

          start_api() {
            : > /tmp/phase2-api.log
            (cd backend/src/TeacherPlatform.Api && dotnet run --no-launch-profile --urls http://localhost:5000 > /tmp/phase2-api.log 2>&1) &
            API_PID=$!
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:5000/health/ready >/dev/null; then return 0; fi
              if ! kill -0 "$API_PID" 2>/dev/null; then cat /tmp/phase2-api.log; return 1; fi
              sleep 1
            done
            cat /tmp/phase2-api.log
            return 1
          }

          start_web() {
            : > /tmp/phase2-web.log
            (cd apps/web && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort > /tmp/phase2-web.log 2>&1) &
            WEB_PID=$!
            for i in $(seq 1 40); do
              if curl -fsS http://localhost:5173/ >/dev/null; then return 0; fi
              if ! kill -0 "$WEB_PID" 2>/dev/null; then cat /tmp/phase2-web.log; return 1; fi
              sleep 1
            done
            cat /tmp/phase2-web.log
            return 1
          }

          start_api
          start_web
          cd e2e
          rm -f state.json
          node seed.mjs
          npx playwright test tests/part-d-builder.spec.mjs --reporter=line
          npx playwright test tests/part-f-english-spark-golden-path.spec.mjs --reporter=line
          npx playwright test tests/part-e-progressive.spec.mjs --reporter=line
          npx playwright test tests/part-a.spec.mjs --reporter=line

          kill "$API_PID"
          wait "$API_PID" 2>/dev/null || true
          cd ..
          start_api
          cd e2e
          npx playwright test tests/part-b.spec.mjs --reporter=line
          npx playwright test tests/part-c-live.spec.mjs --reporter=line
          npx playwright test tests/part-g-students.spec.mjs --reporter=line
          npx playwright test tests/part-h-student-portal.spec.mjs --reporter=line
          npx playwright test tests/part-i-classes-assignments.spec.mjs --reporter=line
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-playwright-failure
          path: |
            e2e/test-results
            /tmp/phase2-api.log
            /tmp/phase2-web.log
          if-no-files-found: ignore
