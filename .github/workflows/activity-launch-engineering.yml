      - name: Restore and generate EF migration
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          dotnet restore
          dotnet tool install --global dotnet-ef --version 10.*
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add AddActivityLaunchIdempotency --project src/TeacherPlatform.Infrastructure --startup-project src/TeacherPlatform.Api
          dotnet format --no-restore

      - name: Verify backend and atomic launch behavior
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          dotnet format --verify-no-changes --no-restore
          dotnet build --no-restore
          dotnet test tests/TeacherPlatform.Domain.Tests --no-build
          dotnet test tests/TeacherPlatform.Api.Tests --no-build
          dotnet test tests/TeacherPlatform.IntegrationTests --no-build

