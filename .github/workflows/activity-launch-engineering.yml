          cd backend
          export PATH="$PATH:$HOME/.dotnet/tools"
          ConnectionStrings__DefaultConnection='Host=localhost;Port=5432;Database=teacher_platform_launch_migration_ci;Username=postgres;Password=postgres_ci_password' dotnet ef database update --project src/TeacherPlatform.Infrastructure --startup-project src/TeacherPlatform.Api

      - name: Verify frontend
