name: Student Portal One-Shot Finalize Patch

on:
  push:
    branches:
      - feature/student-portal-foundation
    paths:
      - .github/workflows/student-portal-finalize-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/student-portal-foundation
      - name: Fix portal integration fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path('backend/tests/TeacherPlatform.IntegrationTests/StudentPortalFlowTests.cs')
          text = path.read_text(encoding='utf-8')
          old = 'new { title = "Portal Quiz", description = "Portal integration", passingPercentage = 50, shuffleQuestions = false }'
          new = 'new { title = "Portal Quiz", slug = $"{slugPrefix}-{Guid.NewGuid():N}", description = "Portal integration" }'
          if old not in text:
              raise SystemExit('Expected quiz fixture payload not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/student-portal-finalize-patch.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/TeacherPlatform.IntegrationTests/StudentPortalFlowTests.cs .github/workflows/student-portal-finalize-patch.yml
          git commit -m "test(student-portal): fix active session fixture [skip ci]"
          git push origin HEAD:feature/student-portal-foundation
