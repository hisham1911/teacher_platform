# ملف اختياري لتشغيل PostgreSQL محليًا بنفس بيانات اعتماد CI — غير إلزامي على جهاز المستخدم إذا لم يتوفر Docker.
# الاستخدام: docker compose -f docker-compose.dev.yml up -d
# بيانات الاعتماد: postgres/postgres — تطوير محلي فقط، لا تستخدمها في أي بيئة مشتركة أو إنتاجية.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teacher_platform
    ports:
      # localhost فقط — غير مكشوفة للشبكة الخارجية
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
